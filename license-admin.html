<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل صدور لایسنس همیار نت</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--p:#1769e0;--p2:#6d42d9;--bg:#f4f7fb;--card:#fff;--text:#1d2638;--muted:#7c8799;--line:#e5eaf2;--ok:#168b57;--bad:#dc3b4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:24px 16px}.topin,.wrap{max-width:900px;margin:auto}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;opacity:.85;font-size:12px}.login,.app{max-width:900px;margin:28px auto;padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 15px 45px #24365c12}.loginbox{max-width:430px;margin:45px auto;text-align:center}.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;margin:auto;font-size:30px}.loginbox input,.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:none;font-family:inherit;background:#fbfcfe}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:12px;padding:11px 15px;cursor:pointer;font-family:inherit;font-weight:800}.primary{background:var(--p);color:#fff}.success{background:var(--ok);color:#fff}.outline{background:#fff;border:1px solid var(--line)}.key{font:800 20px ui-monospace,monospace;direction:ltr;text-align:center;padding:15px;background:#f4f7fc;border-radius:13px;margin:15px 0;letter-spacing:1px}.result{display:none;margin-top:18px;padding:16px;border-radius:14px;background:#eaf8f0;color:var(--ok)}.err{min-height:20px;color:var(--bad);font-size:12px;margin:8px}.info{font-size:12px;color:var(--muted);line-height:2}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.history{margin-top:18px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border:0}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:17px}.top h1{font-size:18px}}</style></head><body><header class="top"><div class="topin"><h1>🔐 پنل صدور لایسنس همیار نت</h1><p>پنل مستقل برای ساخت و صدور لایسنس مشتریان</p></div></header><section id="login" class="login"><div class="card loginbox"><div class="logo">🔑</div><h2>ورود مدیر</h2><p class="info">رمز مدیریت را وارد کنید.</p><input id="pass" type="password" placeholder="رمز مدیریت"><div id="loginErr" class="err"></div><button class="btn primary" style="width:100%" onclick="login()">ورود به پنل</button></div></section><main id="app" class="app" style="display:none"><div class="card"><h2 style="margin-top:0">ساخت لایسنس جدید</h2><p class="info">هر لایسنس از نظر دستگاه محدود نیست؛ فقط یک اتصال همزمان اجازه استفاده دارد.</p><div class="grid"><div class="field"><label>نام مشتری *</label><input id="name" placeholder="نام مشتری یا کافی‌نت"></div><div class="field"><label>شماره تماس</label><input id="phone" placeholder="شماره تماس"></div><div class="field"><label>مدت اعتبار (روز)</label><input id="days" type="number" min="1" value="365"></div><div class="field"><label>کلید لایسنس</label><input id="key" dir="ltr" placeholder="برای تولید خودکار خالی بگذارید"></div><div class="field" style="grid-column:1/-1"><label>یادداشت</label><textarea id="notes" rows="3" placeholder="یادداشت داخلی"></textarea></div></div><div class="actions"><button class="btn outline" onclick="generate()">🎲 تولید کلید</button><button class="btn success" onclick="create()">✓ ساخت و ثبت لایسنس</button><button class="btn outline" onclick="logout()">خروج</button></div><div id="result" class="result"><b>لایسنس با موفقیت ساخته شد</b><div id="resultKey" class="key"></div><button class="btn outline" onclick="copyKey()">کپی کلید</button></div><div id="msg" class="err"></div></div><div class="card history"><h3 style="margin-top:0">آخرین لایسنس‌ها</h3><div id="historyList" class="info">در حال دریافت...</div></div></main><script>
const API='https://dmvttrdvarysgyuzfhgg.supabase.co/functions/v1/hamyar-api';let PASS='';
const $=id=>document.getElementById(id);
async function api(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(payload)});const d=await r.json().catch(()=>({ok:false,message:'پاسخ نامعتبر'}));if(!r.ok)throw Error(d.message||'خطا در ارتباط');return d}
function gen(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let k='HN-';for(let g=0;g<4;g++){for(let i=0;i<4;i++)k+=c[Math.floor(Math.random()*c.length)];if(g<3)k+='-'}return k}
function generate(){ $('key').value=gen(); }
async function login(){const p=$('pass').value.trim();$('loginErr').textContent='';if(!p)return $('loginErr').textContent='رمز مدیریت را وارد کنید';try{const d=await api({action:'list',adminPass:p});if(!d.ok)throw Error(d.message||'ورود ناموفق');PASS=p;sessionStorage.setItem('hamyar_admin_password',p);$('login').style.display='none';$('app').style.display='block';renderHistory(d.licenses||[])}catch(e){$('loginErr').textContent=e.message}}
function logout(){PASS='';sessionStorage.removeItem('hamyar_admin_password');$('app').style.display='none';$('login').style.display='block';$('pass').value=''}
async function create(){const name=$('name').value.trim();if(!name)return $('msg').textContent='نام مشتری را وارد کنید';let key=$('key').value.trim()||gen();$('key').value=key;const days=Math.max(1,parseInt($('days').value)||365);$('msg').textContent='';try{const d=await api({action:'add',adminPass:PASS,key,name,phone:$('phone').value.trim(),durationDays:days,notes:$('notes').value.trim()});if(!d.ok)throw Error(d.message||'ثبت نشد');$('resultKey').textContent=d.license?.key||key;$('result').style.display='block';$('name').value='';$('phone').value='';$('notes').value='';$('key').value='';const all=await api({action:'list',adminPass:PASS});if(all.ok)renderHistory(all.licenses||[])}catch(e){$('msg').textContent=e.message}}
async function copyKey(){try{await navigator.clipboard.writeText($('resultKey').textContent);$('msg').style.color='var(--ok)';$('msg').textContent='کلید کپی شد'}catch{}}
function renderHistory(a){$('historyList').innerHTML=a.slice(0,10).map(x=>`<div class="row"><span>${esc(x.name||'-')}<br><small>${esc(x.expiry||'-')}</small></span><b dir="ltr">${esc(x.key||'')}</b></div>`).join('')||'هنوز لایسنسی ثبت نشده است'}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.addEventListener('DOMContentLoaded',async()=>{const p=sessionStorage.getItem('hamyar_admin_password');if(p){$('pass').value=p;try{await login()}catch{}}});
</script></body></html>
