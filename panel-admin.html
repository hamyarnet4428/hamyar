ry" onclick="openContent()">🎬 افزودن کلیپ/محتوا</button><button class="ghost" onclick="page('users')">👥 مشتریان</button></div></div><div class="panel"><p class="muted" style="font-size:12px;line-height:2;margin:0">مدیریت کامل مشتریان، تب‌ها و زیرتب‌ها، سایت‌ها، فایل‌ها، کلیپ‌ها، لینک‌ها و تنظیمات پنل مشتری از این بخش انجام می‌شود.</p></div>`}

async function refresh(){
 const s=await rpc('state')||{};
 STATE.tabs=Array.isArray(s.tabs)?s.tabs:[];
 STATE.overrides=Array.isArray(s.site_overrides)?s.site_overrides:(Array.isArray(s.overrides)?s.overrides:[]);
 STATE.registrations=Number(s.registrations||0);STATE.pending=Number(s.pending||0);STATE.approved=Number(s.approved||0);
 STATE.config=(s.config&&typeof s.config==='object')?s.config:{}; STATE.registration_auto_approve=!!s.registration_auto_approve; STATE.bale_settings=(s.bale_settings&&typeof s.bale_settings==='object')?s.bale_settings:{};
 LOAD.sites=false;LOAD.users=false;LOAD.content=false;LOAD.documents=false;
 if(CURRENT_PAGE==='users') await ensureUsers(true);
 else if(CURRENT_PAGE==='content') await ensureContent(true);
 else if(CURRENT_PAGE==='sites') await ensureSites(true);
 else if(CURRENT_PAGE==='tabs') renderTabs();
 else if(CURRENT_PAGE==='config') renderConfig();
 renderDash();
}

async function showCustomerActivity(id){try{const d=await userRpc('activity',{id});const c=d?.customer||{};const ev=Array.isArray(d?.events)?d.events:[];const labels={login:'ورود',logout:'خروج',activity:'فعالیت/حضور'};openModal('فعالیت مشتری',`<div class="panel" style="box-shadow:none;margin:0 0 12px;padding:14px"><b>${esc(c.name||'مشتری')}</b><div class="muted" style="margin-top:5px">@${esc(c.username||'')} — ${esc(c.phone||'')}</div></div>${ev.length?ev.map(a=>`<div style="padding:10px 0;border-bottom:1px solid var(--line);font-size:11px"><b>${esc(labels[a.event_type]||a.event_type||'رویداد')}</b><span class="muted" style="margin-right:10px">${fmtDate(a.event_at)}</span><div class="muted" style="margin-top:4px">${esc(JSON.stringify(a.metadata||{}))}</div></div>`).join(''):'<div class="empty">هنوز فعالیتی ثبت نشده است.</div>'}<div class="modal-actions"><button class="ghost" onclick="closeModal()">بستن</button></div>`)}catch(e){toast(e.message||'دریافت فعالیت ناموفق بود',true)}}

b_key}')">حذف/غیرفعال</button>`:`<button class="ok" onclick="restoreTab('${c.tab_key}')">فعال‌سازی</button>`}</div></div>`).join('')}</div>`).join('')||'<div class="empty">تب‌ای وجود ندارد.</div>'}</div></div>`}

function openBaseSite(x){const o=baseOverride(x)||{};openModal('ویرایش کامل سایت پایه',`<div class="form-grid"><input id="b_key" type="hidden" value="${esc(baseKey(x))}"><input id="b_ot" type="hidden" value="${esc(x.tab_key)}"><input id="b_otitle" type="hidden" value="${esc(x.title)}"><input id="b_ourl" type="hidden" value="${esc(x.url)}"><label>تب مقصد<select id="b_tab">${siteTabOptions(o.tab_key||x.tab_key)}</select></label><label>نام سایت<input id="b_title" value="${esc(o.title||x.title)}"></label><label>لینک سایت<input id="b_url" value="${esc(o.url||x.url)}"></label><label>دسته/عنوان نمایشی<input id="b_category" value="${esc(o.category||x.category)}"></label><label>آیکن Font Awesome<input id="b_icon" value="${esc(o.icon||x.icon)}"></label><label>ترتیب نمایش<input id="b_sort" type="number" value="${o.sort_order??500}"></label><label><input id="b_active" type="checkbox" ${o.active!==false?'checked':''}> نمایش در پنل مشتری</label></div><div class="modal-actions"><button class="primary" onclick="saveBaseSite()">ذخیره تغییرات</button><button class="ghost" onclick="closeModal()">انصراف</button></div>`)}
async function saveBaseSite(){try{const p={base_key:document.getElementById('b_key').value,original_tab_key:document.getElementById('b_ot').value,original_title:document.getElementById('b_otitle').value,original_url:document.getElementById('b_ourl').value,tab_key:document.getElementById('b_tab').value,title:document.getElementById('b_title').value,url:document.getElementById('b_url').value,category:document.getElementById('b_category').value,icon:document.getElementById('b_icon').value,sort_order:Number(document.getElementById('b_sort').value||500),active:document.getElementById('b_active').checked};await rpc('site_base_update',p);closeModal();await refresh();toast('سایت پایه با موفقیت ویرایش شد')}catch(e){toast(e.message,true)}}
async function restoreBaseSite(x){if(!confirm('تمام تغییرات این سایت پایه حذف و نسخه اصلی بازگردانی شود؟'))return;try{await rpc('site_base_restore',{base_key:baseKey(x)});await refresh();toast('سایت به حالت اصلی برگشت')}catch(e){toast(e.message,true)}}
async function deleteBaseSite(x){if(!confirm('این سایت از پنل مشتری حذف شود؟'))return;try{await rpc('site_base_delete',{base_key:baseKey(x),original_tab_key:x.tab_key,original_title:x.title,original_url:x.url});await refresh();toast('سایت از پنل مشتری حذف شد')}catch(e){toast(e.message,true)}}
function renderSites(){const q=(document.getElementById('siteSearch')?.value||'').toLowerCase(),tab=document.getElementById('siteTab')?.value||'all';const allRows=BASE_SITES.filter(x=>(!q||((x.title||'')+' '+(x.url||'')+' '+(x.category||'')).toLowerCase().includes(q))&&(!tab||tab==='all'||x.tab_key===tab));const SITE_PAGE_SIZE=60,totalPages=Math.max(1,Math.ceil(allRows.length/SITE_PAGE_SIZE));if(SITE_PAGE>totalPages)SITE_PAGE=totalPages;const rows=allRows.slice((SITE_PAGE-1)*SITE_PAGE_SIZE,SITE_PAGE*SITE_PAGE_SIZE);const hidden=STATE.overrides.filter(x=>x.active!==false&&x.action==='hide'),added=STATE.overrides.filter(x=>x.active!==false&&x.action==='add'),updated=STATE.overrides.filter(x=>x.active!==false&&x.action==='update');document.getElementById('page-sites').innerHTML=`<div class="panel"><div class="panel-head"><h3>مدیریت سایت‌های پایه از Supabase</h3><button class="primary" onclick="openSite()">➕ افزودن سایت جدید</button></div><div class="toolbar"><input id="siteSearch" class="search" value="${esc(q)}" placeholder="جستجوی نام، لینک یا دسته..." oninput="renderSites()"><select id="siteTab" class="search" onchange="SITE_PAGE=1;renderSites()"><option value="all">همه تب‌ها</option>${STATE.tabs.filter(x=>x.active!==false).sort((a,b)=>(a.parent_key||'').localeCompare(b.parent_key||'')||(a.sort_order||0)-(b.sort_order||0)).map(x=>`<option value="${esc(x.tab_key)}" ${x.tab_key===tab?'selected':''}>${esc((x.parent_key?'↳ ':'')+x.title)}</option>`).join('')}</select></div><div class="cards" style="margin-top:12px">${rows.map(x=>{const o=baseOverride(x),h=baseHidden(x);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h4>${esc(o?.title||x.title)}</h4><span class="badge ${h?'off':'on'}">${h?'حذف‌شده':'نمایش'}</span></div><p>${esc(o?.category||x.category)}<br><small>${esc(o?.url||x.url)}</small>${o&&o.tab_key!==x.tab_key?`<br><span class="muted">تب مقصد: ${esc(tabTitle(o.tab_key))}</span>`:''}</p><div class="actions"><button class="blue" onclick='openBaseSite(${JSON.stringify(x)})'>✏️ ویرایش کامل</button>${h?`<button class="ok" onclick='restoreBaseSite(${JSON.stringify(x)})'>↩️ بازگردانی</button>`:`<button class="danger" onclick='deleteBaseSite(${JSON.stringify(x)})'>🗑️ حذف</button>`}${o?`<button class="ghost" onclick='restoreBaseSite(${JSON.stringify(x)})'>↩️ حذف تغییرات</button>`:''}</div></div>`}).join('')||'<div class="empty">موردی پیدا نشد.</div>'}</div><div class="toolbar" style="margin-top:12px;justify-content:center"><button class="ghost" ${SITE_PAGE<=1?'disabled':''} onclick="SITE_PAGE--;renderSites()">◀ قبلی</button><span class="badge sys">صفحه ${SITE_PAGE} از ${totalPages}</span><button class="ghost" ${SITE_PAGE>=totalPages?'disabled':''} onclick="SITE_PAGE++;renderSites()">بعدی ▶</button></div><p class="muted" style="font-size:11px">${rows.length.toLocaleString('fa-IR')} مورد از ${allRows.length.toLocaleString('fa-IR')} مورد فیلترشده نمایش داده شد؛ مجموع سایت‌های پایه ${BASE_SITES.length.toLocaleString('fa-IR')} مورد است.</p></div><div class="panel"><div class="panel-head"><h3>تغییرات ثبت‌شده روی سایت‌های پایه</h3></div>${updated.length?`<div class="cards">${updated.map(x=>`<div class="card"><h4>${esc(x.title)}</h4><p>${esc(x.original_title||'')} → ${esc(x.title)}<br>${esc(x.original_url||'')} → ${esc(x.url||'')}</p><button class="ghost" onclick="restoreBaseByKey('${esc(x.base_key)}')">بازگردانی</button></div>`).join('')}</div>`:'<div class="empty">تغییر سفارشی ثبت نشده است.</div>'}</div><div class="panel"><div class="panel-head"><h3>سایت‌های مخفی‌شده</h3></div>${hidden.length?`<div class="cards">${hidden.map(x=>`<div class="card"><h4>${esc(x.original_title||x.title)}</h4><p>${esc(x.original_url||x.url||'')}</p><button class="ok" onclick="restoreSite('${x.id}')">بازگردانی</button></div>`).join('')}</div>`:'<div class="empty">موردی مخفی نشده است.</div>'}</div><div class="panel"><div class="panel-head"><h3>سایت‌های افزوده‌شده</h3></div>${added.length?`<div class="cards">${added.map(x=>`<div class="card"><h4>${esc(x.title)}</h4><p>${esc(x.url||'')}<br><span class="muted">${esc(tabTitle(x.tab_key))}</span></p><div class="actions"><button class="blue" onclick='openSite(${JSON.stringify(x)})'>ویرایش</button><button class="danger" onclick="deleteAdded('${x.id}')">حذف</button></div></div>`).join('')}</div>`:'<div class="empty">سایت افزوده‌شده‌ای وجود ندارد.</div>'}</div>`}
async function restoreBaseByKey(k){try{await rpc('site_base_restore',{base_key:k});await refresh();toast('بازگردانی شد')}catch(e){toast(e.message,true)}}
async function hideBaseSite(x){try{await rpc('site_hide',{tab_key:x.tab_key,title:x.title,url:x.url});await refresh();toast('سایت از پنل مشتری حذف شد')}catch(e){toast(e.message,true)}}
async function restoreSite(id){try{await rpc('site_restore',{id});await refresh();toast('سایت بازگردانی شد')}catch(e){toast(e.message,true)}}
async function deleteAdded(id){if(!confirm('سایت افزوده‌شده حذف شود؟'))return;try{await rpc('site_delete_added',{id});await refresh();toast('سایت حذف شد')}catch(e){toast(e.message,true)}}
function contentTabOptions(sel='resource:training'){return STATE.tabs.filter(x=>x.active!==false).sort((a,b)=>(a.parent_key||'').localeCompare(b.parent_key||'')||(a.sort_order||0)-(b.sort_order||0)).map(x=>`<option value="${esc(x.tab_key)}" ${x.tab_key===sel?'selected':''}>${esc((x.parent_key?'↳ ':'')+x.title)}</option>`).join('')}
function customerOptions(sel=''){return `<option value="">همه مشتریان (عمومی)</option>`+(STATE.regRows||[]).filter(x=>x.status==='approved').map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(x.name)} — @${esc(x.username||'')}</option>`).join('')}
function openContent(item=null){
  const isDoc=item?.item_type==='form'||item?.item_type==='file';
  const isBaseForm=!!(item?.base&&item?.item_type==='form');
  const currentFileUrl=isBaseForm?(item?.file_url||''):(item?.url||item?.file_url||'');
  openModal(item?'ویرایش محتوا':'افزودن فایل / کلیپ / لینک',`<div class="form-grid"><input id="c_id" type="hidden" value="${esc(item?.id||'')}"><input id="c_base_form_key" type="hidden" value="${esc(isBaseForm?(item?.url||''):'')}"><label>عنوان<input id="c_title" value="${esc(item?.title||'')}"></label><label>توضیحات<textarea id="c_desc">${esc(item?.description||'')}</textarea></label><label>نوع محتوا<select id="c_type" onchange="toggleUploadFields()"><option value="video" ${item?.item_type==='video'?'selected':''}>کلیپ آموزشی</option><option value="file" ${item?.item_type==='file'?'selected':''}>فایل (PDF / Word / Excel / ...)</option><option value="link" ${item?.item_type==='link'?'selected':''}>لینک وب‌سایت</option><option value="form" ${item?.item_type==='form'?'selected':''}>فرم / نامه اداری</option><option value="notice" ${item?.item_type==='notice'?'selected':''}>اطلاعیه</option></select></label><label>محل نمایش در پنل مشتری<select id="c_tab" ${isDoc?'disabled':''}>${contentTabOptions(item?.tab_key||(isDoc?'resource:forms':'resource:training'))}</select></label>${isDoc?'<div class="muted" style="grid-column:1/-1;background:#f8fafc;border:1px solid var(--line);padding:10px 12px;border-radius:12px;line-height:1.9">📄 این فایل پس از ذخیره، به‌صورت <b>زیرتب مستقل</b> در بخش «فایل‌ها و نامه‌های اداری» و در کنار «مبایعه نامه» و «اجاره نامه» در پنل مشتری نمایش داده می‌شود.</div>':''}${isBaseForm?'<div class="muted" style="grid-column:1/-1;background:#eff6ff;border:1px solid #bfdbfe;padding:10px 12px;border-radius:12px;line-height:1.9">🖼️ این یکی از ۴ فرم پایه مشتری است. تصویر فرم در Storage نگهداری می‌شود و فقط آدرس آن در Supabase ثبت می‌شود.</div>':''}<label id="docCategoryWrap" style="display:${isDoc?'block':'none'}">دسته فایل اداری<select id="c_doc_category"><option value="form" ${item?.category==='form'?'selected':''}>فرم‌ها</option><option value="letter" ${item?.category==='letter'?'selected':''}>نامه‌های اداری</option><option value="contract" ${item?.category==='contract'?'selected':''}>قراردادها</option><option value="resume" ${item?.category==='resume'?'selected':''}>رزومه</option></select></label><label>اختصاص به مشتری (اختیاری)<select id="c_customer">${customerOptions(item?.customer_id||'')}</select></label><label>آدرس فایل/محتوا<input id="c_url" value="${esc(currentFileUrl)}" placeholder="https://..."></label><div class="upload-box" id="uploadBox"><b>آپلود فایل</b><input id="c_file" type="file"><div id="uploadStatus" class="muted" style="margin-top:6px;font-size:11px">برای کلیپ یا فایل، فایل را انتخاب و آپلود کنید.</div><div class="progress"><i id="uploadProgress"></i></div><button class="blue" style="margin-top:8px" onclick="uploadFile()">⬆️ آپلود فایل</button></div><label>ترتیب نمایش<input id="c_sort" type="number" value="${item?.sort_order??500}"></label><label><input id="c_active" type="checkbox" ${item?.active!==false?'checked':''}> فعال باشد</label></div><div class="modal-actions"><button class="primary" onclick="saveContent()">ذخیره</button><button class="ghost" onclick="closeModal()">انصراف</button></div>`);toggleUploadFields()}
function toggleUploadFields(){const t=document.getElementById('c_type')?.value,b=document.getElementById('uploadBox'),cw=document.getElementById('docCategoryWrap');if(b)b.style.display=(t==='video'||t==='file'||t==='form')?'block':'none';if(cw)cw.style.display=(t==='file'||t==='form')?'block':'none';const f=document.getElementById('c_file');if(f)f.accept=t==='video'?'video/*':(t==='file'||t==='form')?'.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.jpg,.jpeg,.png,.txt,*/*':''}
async function uploadFile(){const f=document.getElementById('c_file')?.files?.[0],t=document.getElementById('c_type')?.value;if(!f)return toast('ابتدا فایل را انتخاب کنید.',true);if(t==='video'&&!f.type.startsWith('video/'))return toast('برای کلیپ فقط فایل ویدیویی مجاز است.',true);try{const st=document.getElementById('uploadStatus'),pr=document.getElementById('uploadProgress');st.textContent='در حال آپلود فایل...';const isBaseForm=!!document.getElementById('c_base_form_key')?.value;if(isBaseForm||t==='video'){const r=await fetch(MEDIA_FN,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({password:normalizeAdminPassword(document.getElementById('pass')?.value||PASS),filename:f.name,contentType:f.type||'application/octet-stream'})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'گرفتن لینک آپلود ناموفق بود');if(!SB)throw new Error('کتابخانه آپلود در دسترس نیست');st.textContent='در حال آپلود فایل...';const up=await SB.storage.from('hamyar-media').uploadToSignedUrl(d.path,d.token,f,{contentType:f.type||'application/octet-stream',cacheControl:'31536000'});if(up.error)throw up.error;document.getElementById('c_url').value=d.publicUrl;pr.style.width='100%';st.textContent='✅ آپلود در Storage انجام شد.';toast('فایل آپلود شد');return}if(t==='file'||t==='form'){const safe=f.name.replace(/[^\p{L}\p{N}._-]+/gu,'_').replace(/^\.+/,'').slice(0,120)||'file';const path='admin/'+Date.now()+'-'+crypto.randomUUID()+'-'+safe;const r=await fetch(DOCUMENTS_API+'?action=upload&file='+encodeURIComponent(path),{method:'POST',headers:{'x-upload-token':DOCUMENT_UPLOAD_TOKEN,'Content-Type':f.type||'application/octet-stream'},body:f,cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'آپلود فایل اداری ناموفق بود');document.getElementById('c_url').value=path;document.getElementById('c_id').value='';pr.style.width='100%';st.textContent='✅ فایل در مخزن فایل‌های اداری آپلود شد.';toast('فایل آپلود شد');return}}catch(e){toast(e.message,true);const st=document.getElementById('uploadStatus');if(st)st.textContent='خطا: '+e.message}}

function renderContent(){
 const q=(document.getElementById('contentSearch')?.value||'').toLowerCase(),type=document.getElementById('contentType')?.value||'all';
 const dynamic=Array.isArray(STATE.content)?STATE.content:[];
 const docs=(Array.isArray(STATE.documents)?STATE.documents:[]).map(d=>({...d,item_type:d.item_type||'file',tab_key:'resource:forms',url:d.url||d.file_url||'',_managedDocument:true}));
 const byId=new Map(dynamic.map(x=>[String(x.id),x]));
 const base=BASE_CONTENT.map(x=>byId.has(String(x.id))?{...x,...byId.get(String(x.id))}:x);
 const baseIds=new Set(BASE_CONTENT.map(x=>String(x.id)));
 const extras=dynamic.filter(x=>!baseIds.has(String(x.id)));
 const all=base.map(x=>({...x,base:true}),).concat(extras).concat(docs);
 const arr=all.filter(x=>(!q||((x.title||'')+' '+(x.description||'')).toLowerCase().includes(q))&&(type==='all'||x.item_type===type));
 const videos=arr.filter(x=>x.item_type==='video'),forms=arr.filter(x=>x.item_type==='form'),files=arr.filter(x=>x.item_type==='file'),other=arr.filter(x=>!['video','form','file'].includes(x.item_type));
 const card=x=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h4>${esc(x.title)}</h4><span class="badge ${x.base?'sys':x.active?'on':'off'}">${x.base?'پایه مشتری':x.active?'فعال':'خاموش'}</span></div>${x.item_type==='video'&&x.url?`<video controls preload="metadata" style="width:100%;margin:10px 0;border-radius:12px;background:#0f172a;aspect-ratio:16/9" src="${esc(x.url)}"></video>`:''}${x.item_type==='form'&&x.file_url?`<img src="${esc(x.file_url)}" alt="${esc(x.title)}" style="width:100%;max-height:240px;object-fit:contain;margin:10px 0;border-radius:12px;border:1px solid var(--line);background:#f8fafc">`:''}<p>${esc(x.description||'')}<br><span class="muted">${esc(tabTitle(x.tab_key||'---'))}${x.customer_id?' • اختصاصی':' • عمومی'}</span>${x.file_url?`<br><small dir="ltr">${esc(x.file_url)}</small>`:(x.url?`<br><small dir="ltr">${esc(x.url)}</small>`:'')}</p><div class="actions" style="margin-top:8px"><button class="blue" onclick='openContent(${JSON.stringify(x)})'>✏️ ویرایش</button>${x._managedDocument?`<span class="badge sys">زیرتب فایل‌ها</span>`:`<button class="${x.active?'danger':'ok'}" onclick="toggleContent('${x.id}',${!x.active})">${x.active?'خاموش کردن':'فعال کردن'}</button>${x.base?'':`<button class="danger" onclick='deleteContent(${JSON.stringify(x.id)})'>🗑️ حذف</button>`}`}</div></div>`;
 document.getElementById('page-content').innerHTML=`<div class="panel"><div class="panel-head"><div><h3>مدیریت فایل‌ها و کلیپ‌های پنل مشتری</h3><p class="muted" style="margin:5px 0 0;font-size:11px">فایل‌ها و فرم‌های اداری از همین بخش مدیریت می‌شوند و در پنل مشتری به‌صورت زیرتب مستقل، کنار «مبایعه نامه» و «اجاره نامه»، نمایش داده می‌شوند.</p></div><div class="actions"><button class="primary" onclick="openContent()">➕ افزودن محتوا</button><button class="ghost" onclick="openContent({item_type:'video',tab_key:'resource:training'})">🎬 افزودن کلیپ</button><button class="ghost" onclick="openContent({item_type:'file',tab_key:'resource:forms'})">📄 افزودن فایل</button></div></div><div class="toolbar"><input id="contentSearch" class="search" value="${esc(q)}" placeholder="جستجوی عنوان یا توضیحات..." oninput="renderContent()"><select id="contentType" class="search" onchange="renderContent()"><option value="all">همه محتوا</option><option value="video" ${type==='video'?'selected':''}>کلیپ‌های آموزشی (${videos.length})</option><option value="form" ${type==='form'?'selected':''}>فرم‌ها (${forms.length})</option><option value="file" ${type==='file'?'selected':''}>فایل‌ها (${files.length})</option><option value="link" ${type==='link'?'selected':''}>لینک‌ها</option><option value="notice" ${type==='notice'?'selected':''}>اطلاعیه‌ها</option></select></div></div><div class="panel"><div class="panel-head"><h3>🎬 کلیپ‌های آموزشی</h3><span class="badge sys">${videos.length} مورد</span></div><div class="cards">${videos.map(card).join('')||'<div class="empty">کلیپی وجود ندارد.</div>'}</div></div><div class="panel"><div class="panel-head"><h3>📄 فرم‌ها و نامه‌های اداری</h3><span class="badge sys">${forms.length} مورد</span></div><div class="cards">${forms.map(card).join('')||'<div class="empty">فرمی وجود ندارد.</div>'}</div></div>${files.length?`<div class="panel"><div class="panel-head"><h3>📁 فایل‌های قابل دانلود</h3><span class="badge sys">${files.length} مورد</span></div><div class="cards">${files.map(card).join('')}</div></div>`:''}${other.length?`<div class="panel"><div class="panel-head"><h3>🔗 سایر محتوا</h3></div><div class="cards">${other.map(card).join('')}</div></div>`:''}`
}
async function saveContent(){try{const t=document.getElementById('c_type').value;const isDoc=t==='file'||t==='form';const baseFormKey=document.getElementById('c_base_form_key')?.value||'';if(baseFormKey){await contentRpc('upsert',{id:document.getElementById('c_id').value||null,title:document.getElementById('c_title').value,description:document.getElementById('c_desc').value,item_type:'form',tab_key:'resource:forms',url:baseFormKey,file_url:document.getElementById('c_url').value,file_path:'',metadata:{source:'base-form',form_key:baseFormKey.replace('static-form:','')},sort_order:Number(document.getElementById('c_sort').value||500),active:document.getElementById('c_active').checked});closeModal();await refresh();toast('فرم پایه و آدرس تصویر در Supabase ذخیره شد');return}if(isDoc){const pass=normalizeAdminPassword(document.getElementById('pass')?.value||PASS);const payload={id:document.getElementById('c_id').value||null,title:document.getElementById('c_title').value,description:document.getElementById('c_desc').value,category:document.getElementById('c_doc_category').value,file_url:document.getElementById('c_url').value,file_type:(document.getElementById('c_url').value.match(/\.([A-Za-z0-9]{1,12})(?:\?|$)/)||[])[1]||'FILE',sort_order:Number(document.getElementById('c_sort').value||500),active:document.getElementById('c_active').checked,password:pass};const r=await fetch(DOCUMENT_RPC,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'upsert',admin_password:pass,payload}),cache:'no-store'});const d=await r.json();if(!r.ok||d?.error)throw new Error(d?.message||d?.error||'ذخیره فایل اداری ناموفق بود');closeModal();await refresh();toast('فایل اداری ذخیره شد');return}await contentRpc('upsert',{id:document.getElementById('c_id').value||null,title:document.getElementById('c_title').value,description:document.getElementById('c_desc').value,item_type:t,tab_key:document.getElementById('c_tab').value,url:document.getElementById('c_url').value,sort_order:Number(document.getElementById('c_sort').value||500),active:document.getElementById('c_active').checked,customer_id:document.getElementById('c_customer').value||null});closeModal();await refresh();toast('محتوا ذخیره شد')}catch(e){toast(e.message,true)}}
async function contentRpc(action,payload={}){const pass=normalizeAdminPassword(document.getElementById('pass')?.value||PASS);if(pass)PASS=pass;const r=await fetch(CONTENT_RPC,{method:'POST',headers:headers(),body:JSON.stringify({action,admin_password:pass,payload}),cache:'no-store'});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||d?.code||'خطای مدیریت محتوا');return d}
async function toggleContent(id,active){try{await contentRpc('toggle',{id,active});await refresh();toast(active?'فعال شد':'خاموش شد')}catch(e){toast(e.message,true)}}
async function deleteContent(id){if(!confirm('این محتوا حذف شود؟'))return;try{await contentRpc('delete',{id});await refresh();toast('محتوا حذف شد')}catch(e){toast(e.message,true)}}

 try{

 }catch(e){toast(e.message||'ذخیره تأیید خودکار ناموفق بود',true)}
}
