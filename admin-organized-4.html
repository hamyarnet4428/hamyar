async function userRpc(action,payload={}){const pass=normalizeAdminPassword(document.getElementById('pass')?.value||PASS);if(pass)PASS=pass;const r=await fetch(USER_RPC,{method:'POST',headers:headers(),body:JSON.stringify({action,admin_password:pass,payload}),cache:'no-store'});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||d?.code||'خطای مدیریت مشتری');return d}

function statusLabel(st){return st==='approved'?'تأیید شده':st==='pending'?'در انتظار':st==='disabled'?'غیرفعال':st==='deleted'?'حذف شده':'رد شده'}
function userRows(rows){return rows.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small class="muted">@${esc(x.username||'')}</small></td><td>${esc(x.phone)}</td><td><span class="badge ${x.status==='approved'?'on':x.status==='pending'?'sys':'off'}">${statusLabel(x.status)}</span></td><td>${fmtDate(x.created_at)}</td><td><div class="actions"><button class="blue" onclick='editUser(${JSON.stringify(x)})'>ویرایش</button>${x.status==='pending'?`<button class="ok" onclick="approve('${x.id}')">تأیید</button><button class="danger" onclick="reject('${x.id}')">رد</button>`:''}${x.status==='approved'?`<button class="danger" onclick="setUserStatus('${x.id}','disabled')">غیرفعال</button>`:''}${x.status==='disabled'||x.status==='rejected'?`<button class="ok" onclick="setUserStatus('${x.id}','approved')">فعال‌سازی</button>`:''}<button class="danger" onclick="deleteCustomer('${x.id}')">حذف</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="muted">مشتری‌ای وجود ندارد.</td></tr>'}
function editUser(x){openModal('مدیریت مشتری',`<div class="form-grid"><label>نام کافی‌نت<input id="u_name" value="${esc(x.name||'')}"></label><label>شماره تماس<input id="u_phone" value="${esc(x.phone||'')}"></label><label>نام کاربری<input id="u_username" value="${esc(x.username||'')}"></label><label>وضعیت<select id="u_status"><option value="pending" ${x.status==='pending'?'selected':''}>در انتظار</option><option value="approved" ${x.status==='approved'?'selected':''}>تأیید شده</option><option value="rejected" ${x.status==='rejected'?'selected':''}>رد شده</option><option value="disabled" ${x.status==='disabled'?'selected':''}>غیرفعال</option></select></label><label>رمز عبور جدید (اختیاری)<input id="u_password" type="password" placeholder="برای تغییر رمز وارد کنید"></label><label>دلیل رد/یادداشت<textarea id="u_reason">${esc(x.reject_reason||'')}</textarea></label></div><div class="modal-actions"><button class="primary" onclick="saveUser('${x.id}')">ذخیره</button><button class="ghost" onclick="closeModal()">انصراف</button></div>`)}
async function saveUser(id){try{await userRpc('update',{id,name:document.getElementById('u_name').value,phone:document.getElementById('u_phone').value,username:document.getElementById('u_username').value,status:document.getElementById('u_status').value,reject_reason:document.getElementById('u_reason').value,new_password:document.getElementById('u_password').value||null});closeModal();await refresh();toast('اطلاعات مشتری ذخیره شد')}catch(e){toast(e.message,true)}}
async function setUserStatus(id,status){try{await userRpc('update',{id,status});await refresh();toast('وضعیت مشتری تغییر کرد')}catch(e){toast(e.message,true)}}
async function approve(id){try{await userRpc('update',{id,status:'approved'});await refresh();toast('مشتری تأیید شد')}catch(e){toast(e.message,true)}}
async function reject(id){const r=prompt('دلیل رد درخواست:','درخواست توسط مدیر تأیید نشد.');if(r===null)return;try{await userRpc('update',{id,status:'rejected',reject_reason:r});await refresh();toast('درخواست رد شد')}catch(e){toast(e.message,true)}}

 const all=base.map(x=>({...x,base:true}),).concat(extras);
 const arr=all.filter(x=>(!q||((x.title||'')+' '+(x.description||'')).toLowerCase().includes(q))&&(type==='all'||x.item_type===type));
 const videos=arr.filter(x=>x.item_type==='video'),forms=arr.filter(x=>x.item_type==='form'),files=arr.filter(x=>x.item_type==='file'),other=arr.filter(x=>!['video','form','file'].includes(x.item_type));
 const card=x=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h4>${esc(x.title)}</h4><span class="badge ${x.base?'sys':x.active?'on':'off'}">${x.base?'پایه مشتری':x.active?'فعال':'خاموش'}</span></div>${x.item_type==='video'&&x.url?`<video controls preload="metadata" style="width:100%;margin:10px 0;border-radius:12px;background:#0f172a;aspect-ratio:16/9" src="${esc(x.url)}"></video>`:''}<p>${esc(x.description||'')}<br><span class="muted">${esc(tabTitle(x.tab_key||'---'))}${x.customer_id?' • اختصاصی':' • عمومی'}</span>${x.url?`<br><small dir="ltr">${esc(x.url)}</small>`:''}</p><div class="actions" style="margin-top:8px"><button class="blue" onclick='openContent(${JSON.stringify(x)})'>✏️ ویرایش</button><button class="${x.active?'danger':'ok'}" onclick="toggleContent('${x.id}',${!x.active})">${x.active?'خاموش کردن':'فعال کردن'}</button>${x.base?'':`<button class="danger" onclick='deleteContent(${JSON.stringify(x.id)})'>🗑️ حذف</button>`}</div></div>`;
 document.getElementById('page-content').innerHTML=`<div class="panel"><div class="panel-head"><div><h3>مدیریت فایل‌ها و کلیپ‌های پنل مشتری</h3><p class="muted" style="margin:5px 0 0;font-size:11px">محتوای پایه فایل مشتری در کنار محتواهای قابل مدیریت از Supabase نمایش داده می‌شود.</p></div><div class="actions"><button class="primary" onclick="openContent()">➕ افزودن محتوا</button><button class="ghost" onclick="openContent({item_type:'video',tab_key:'resource:training'})">🎬 افزودن کلیپ</button><button class="ghost" onclick="openContent({item_type:'file',tab_key:'resource:forms'})">📄 افزودن فایل</button></div></div><div class="toolbar"><input id="contentSearch" class="search" value="${esc(q)}" placeholder="جستجوی عنوان یا توضیحات..." oninput="renderContent()"><select id="contentType" class="search" onchange="renderContent()"><option value="all">همه محتوا</option><option value="video" ${type==='video'?'selected':''}>کلیپ‌های آموزشی (${videos.length})</option><option value="form" ${type==='form'?'selected':''}>فرم‌ها (${forms.length})</option><option value="file" ${type==='file'?'selected':''}>فایل‌ها (${files.length})</option><option value="link" ${type==='link'?'selected':''}>لینک‌ها</option><option value="notice" ${type==='notice'?'selected':''}>اطلاعیه‌ها</option></select></div></div><div class="panel"><div class="panel-head"><h3>🎬 کلیپ‌های آموزشی</h3><span class="badge sys">${videos.length} مورد</span></div><div class="cards">${videos.map(card).join('')||'<div class="empty">کلیپی وجود ندارد.</div>'}</div></div><div class="panel"><div class="panel-head"><h3>📄 فرم‌ها و نامه‌های اداری</h3><span class="badge sys">${forms.length} مورد</span></div><div class="cards">${forms.map(card).join('')||'<div class="empty">فرمی وجود ندارد.</div>'}</div></div>${files.length?`<div class="panel"><div class="panel-head"><h3>📁 فایل‌های قابل دانلود</h3><span class="badge sys">${files.length} مورد</span></div><div class="cards">${files.map(card).join('')}</div></div>`:''}${other.length?`<div class="panel"><div class="panel-head"><h3>🔗 سایر محتوا</h3></div><div class="cards">${other.map(card).join('')}</div></div>`:''}`
}
async function saveContent(){try{await contentRpc('upsert',{id:document.getElementById('c_id').value||null,title:document.getElementById('c_title').value,description:document.getElementById('c_desc').value,item_type:document.getElementById('c_type').value,tab_key:document.getElementById('c_tab').value,url:document.getElementById('c_url').value,sort_order:Number(document.getElementById('c_sort').value||500),active:document.getElementById('c_active').checked,customer_id:document.getElementById('c_customer').value||null});closeModal();await refresh();toast('محتوا ذخیره شد')}catch(e){toast(e.message,true)}}
async function contentRpc(action,payload={}){const pass=normalizeAdminPassword(document.getElementById('pass')?.value||PASS);if(pass)PASS=pass;const r=await fetch(CONTENT_RPC,{method:'POST',headers:headers(),body:JSON.stringify({action,admin_password:pass,payload}),cache:'no-store'});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{}if(!r.ok)throw new Error(d?.message||d?.details||d?.hint||d?.code||'خطای مدیریت محتوا');return d}
async function toggleContent(id,active){try{await contentRpc('toggle',{id,active});await refresh();toast(active?'فعال شد':'خاموش شد')}catch(e){toast(e.message,true)}}
async function deleteContent(id){if(!confirm('این محتوا حذف شود؟'))return;try{await contentRpc('delete',{id});await refresh();toast('محتوا حذف شد')}catch(e){toast(e.message,true)}}
function renderConfig(){const c=STATE.config||{};document.getElementById('page-config').innerHTML=`<div class="panel"><div class="panel-head"><h3>کنترل ظاهر و متن‌های پنل مشتری</h3><button class="ghost" onclick="resetConfigForm()">بازنشانی فرم</button></div><div class="form-grid"><label>عنوان اصلی هدر<input id="cfg_header_title" value="${esc(c.header_title||'سامانه جامع کافی نت های ایران')}"></label><label>زیرعنوان هدر<input id="cfg_header_subtitle" value="${esc(c.header_subtitle||'همیار نت همیار همیشگی شما در تمام لحضات')}"></label><label>متن پشتیبانی<input id="cfg_support_text" value="${esc(c.support_text||'📞 پشتیبانی و هماهنگی همیارنت🖥️ : 09033764428-09999930719')}"></label><label>متن سازنده/اعتبار<input id="cfg_designer_credit" value="${esc(c.designer_credit||'🌐طراحی و ساخت همیار نت🌐 09999930719-09033764428')}"></label><label>عنوان بالای داشبورد<input id="cfg_hero_kicker" value="${esc(c.hero_kicker||'داشبورد هوشمند همیار نت')}"></label><label>عنوان خوش‌آمدگویی<input id="cfg_hero_title" value="${esc(c.hero_title||'خوش آمدید 👋')}"></label><label>متن زیر خوش‌آمدگویی<input id="cfg_hero_subtitle" value="${esc(c.hero_subtitle||'همه ابزارهای مورد نیاز کافی‌نت، یکجا و سریع.')}"></label><label>آیکن هدر<input id="cfg_header_icon" value="${esc(c.header_icon||'fa-solid fa-globe')}"></label><label>رنگ اصلی<input id="cfg_primary_color" type="text" value="${esc(c.primary_color||'#0d6efd')}"></label><label>رنگ دوم<input id="cfg_secondary_color" type="text" value="${esc(c.secondary_color||'#6f42c1')}"></label><label>رنگ پس‌زمینه<input id="cfg_background_color" value="${esc(c.background_color||'#f4f7fb')}"></label><label>رنگ کارت‌ها<input id="cfg_card_color" value="${esc(c.card_color||'#ffffff')}"></label></div><div class="modal-actions"><button class="primary" onclick="saveConfig()">💾 ذخیره و اعمال روی همه مشتریان</button></div></div><div class="panel"><p class="muted" style="line-height:2;margin:0">هر تغییری در این بخش بعد از بارگذاری مجدد پنل مشتری اعمال می‌شود. مدیر می‌تواند متن‌ها، رنگ‌ها و آیکن هدر را بدون تغییر فایل HTML کنترل کند.</p></div>`}
async function saveConfig(){try{const c={header_title:document.getElementById('cfg_header_title').value,header_subtitle:document.getElementById('cfg_header_subtitle').value,support_text:document.getElementById('cfg_support_text').value,designer_credit:document.getElementById('cfg_designer_credit').value,hero_kicker:document.getElementById('cfg_hero_kicker').value,hero_title:document.getElementById('cfg_hero_title').value,hero_subtitle:document.getElementById('cfg_hero_subtitle').value,header_icon:document.getElementById('cfg_header_icon').value,primary_color:document.getElementById('cfg_primary_color').value,secondary_color:document.getElementById('cfg_secondary_color').value,background_color:document.getElementById('cfg_background_color').value,card_color:document.getElementById('cfg_card_color').value};await rpc('config_save',c);STATE.config=c;toast('تنظیمات مشتری ذخیره شد')}catch(e){toast(e.message,true)}}
function resetConfigForm(){renderConfig()}
async function renderLogs(){try{const d=await rpc('logs');document.getElementById('page-logs').innerHTML=`<div class="panel"><div class="panel-head"><h3>آخرین فعالیت‌ها</h3></div>${d?.length?d.map(x=>`<div style="padding:10px;border-bottom:1px solid var(--line);font-size:11px"><b>${esc(x.action)}</b><div class="muted">${fmtDate(x.created_at)}</div><div>${esc(JSON.stringify(x.details||{}))}</div></div>`).join(''):'<div class="empty">هنوز فعالیتی ثبت نشده است.</div>'}</div>`}catch(e){toast(e.message,true)}}
function logout(){PASS='';location.reload()}
window.addEventListener('DOMContentLoaded',()=>renderUsers());
